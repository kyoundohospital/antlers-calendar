<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹿島アントラーズ観戦カレンダー</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="app-header">
  <h1>鹿島アントラーズ観戦カレンダー</h1>
  <div class="toolbar">
    <button id="prevSeasonBtn">◀ 前年度</button>
    <span id="seasonLabel" class="season-label"></span>
    <button id="nextSeasonBtn">翌年度 ▶</button>
    <button id="reloadBtn">今すぐ再読み込み</button>
    <button id="addMatchBtn">試合を手動追加</button>
    <button id="placesBtn">観戦場所管理</button>
    <button id="printBtn">印刷 / PDF (A3横)</button>
    <button id="exportBtn">バックアップ書き出し</button>
    <button id="importBtn">バックアップ読み込み</button>
    <input type="file" id="importFile" accept="application/json" hidden>
    <span id="syncStatus" class="sync-status"></span>
  </div>
</header>

<main>
  <div class="calendar-scroll">
    <div id="calendarGrid" class="calendar-grid"></div>
  </div>
</main>

<div id="detailModal" class="modal-overlay hidden"></div>
<div id="placesModal" class="modal-overlay hidden"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
