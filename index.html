<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹿島アントラーズ観戦カレンダー</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="app-header">
  <h1>鹿島アントラーズ観戦カレンダー</h1>
  <div class="toolbar">
    <button id="prevSeasonBtn">◀</button>
    <span id="seasonLabel" class="season-label"></span>
    <button id="nextSeasonBtn">▶</button>
    <button id="reloadBtn">取得</button>
    <button id="addMatchBtn">手動追加</button>
    <button id="placesBtn">マスタ</button>
    <button id="printBtn">印刷</button>
    <span id="syncStatus" class="sync-status"></span>
  </div>
</header>

<main>
  <div class="calendar-scroll">
    <div id="printTitle" class="print-title"></div>
    <div id="calendarGrid" class="calendar-grid"></div>
  </div>
</main>

<div id="detailModal" class="modal-overlay hidden"></div>
<div id="placesModal" class="modal-overlay hidden"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
