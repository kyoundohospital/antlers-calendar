<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹿島アントラーズ観戦カレンダー</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="app-header">
  <h1>
    鹿島アントラーズ観戦カレンダー
    <svg class="title-logo" viewBox="0 0 64 48" aria-hidden="true" focusable="false">
      <path d="M32 40 L32 22
               M32 30 C24 30 20 24 14 22 M14 22 C10 21 7 17 6 12 M14 22 C12 26 13 31 17 33
               M32 26 C26 24 23 17 22 10 M22 10 C19 8 17 4 17 2 M22 10 C24 13 26 16 30 17
               M32 30 C40 30 44 24 50 22 M50 22 C54 21 57 17 58 12 M50 22 C52 26 51 31 47 33
               M32 26 C38 24 41 17 42 10 M42 10 C45 8 47 4 47 2 M42 10 C40 13 38 16 34 17"
            fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </h1>
  <div class="toolbar">
    <button id="prevSeasonBtn">◀</button>
    <span id="seasonLabel" class="season-label"></span>
    <button id="nextSeasonBtn">▶</button>
    <button id="reloadBtn">取得</button>
    <button id="addMatchBtn">手動追加</button>
    <button id="placesBtn">マスタ</button>
    <button id="printBtn">印刷</button>
    <span id="syncStatus" class="sync-status"></span>
  </div>
</header>

<main>
  <div class="calendar-scroll">
    <div id="printTitle" class="print-title"></div>
    <div id="calendarGrid" class="calendar-grid"></div>
  </div>
</main>

<div id="detailModal" class="modal-overlay hidden"></div>
<div id="placesModal" class="modal-overlay hidden"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
